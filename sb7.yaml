status: ready
mode: customer-facing
audience:
  - Point32Health executive leadership
  - agent governance and security leaders
  - technology decision makers

headline: Turn 800 agent experiments into one governed path forward.

hero:
  entity: Point32Health
  desired_outcome: >
    Give employees room to move faster with AI agents while giving
    governance and security leaders the visibility and control to scale
    what works.

problem:
  external: >
    Agent creation and distribution may be moving faster than centralized
    inventory, ownership, access, sharing, data, and connector controls.
  internal: >
    Leadership must choose a path without yet having comparable evidence
    that shows whether current controls are enough or Agent 365 adds
    material value.
  stakes: >
    When oversight cannot keep pace, each new agent can add review effort,
    uncertainty, and friction. Innovation may continue, but confidence to
    scale it does not.

guide:
  empathy: >
    Point32Health should not have to choose between momentum and control,
    or make a significant investment on the strength of a feature tour.
  competence_evidence:
    - Microsoft can evaluate existing and proposed controls against the same agents and scenarios.
    - A frozen scorecard can make improvements, tradeoffs, and remaining gaps visible.
    - The evaluation can explicitly document licensing, configuration, and residual-risk boundaries.

plan:
  - Frame it: name the accountable owner, set the decision date, and freeze representative scenarios and scorecard thresholds.
  - Prove it: baseline current controls, then test Agent 365 against the same agents, scenarios, and evidence requirements.
  - Choose it: scale, retain, remediate and retest, or declare the evidence inconclusive.

action:
  next_step: Name the owner, set the decision date, and approve the structured proof.
  owner: To be named by Point32Health before proof approval.
  due_date: null
  readiness_conditions:
    - Name one accountable Point32Health decision maker and the required advisers.
    - Set the proof milestones and final decision date.
    - Approve representative scenarios, measurement methods, and decision rules.

failure_avoided: >
  Avoid allowing agent growth to outrun oversight or making an expensive
  decision from assumptions, whether that means buying controls that add
  too little or rejecting controls that could remove material friction.

success:
  future_state: >
    Employees can use approved agents within clear boundaries. Governance teams
    can see ownership, access, data, and connections without opening every agent.
    Security teams can investigate with coherent evidence. Point32Health can move
    proven agents from experimentation to governed scale while understanding the
    residual risk it is choosing to carry.
  metrics:
    - Coverage of agent ownership, access, data, and connector visibility.
    - Pass rate for agreed access and sharing policy scenarios.
    - Investigation time and required evidence available for agreed scenarios.
    - Manual steps or analyst effort remaining after the proof.
    - Severity of unresolved risks and the authority required to accept them.
    - Licensing and operating cost against an agreed economic hurdle.
  decision_rule:
    scale: Safety gates, improvement thresholds, residual-risk acceptance, and the economic hurdle are met.
    retain: Existing controls meet the agreed need and Agent 365 does not clear the incremental-value threshold.
    remediate_and_retest: Material value is visible, but a defined control or configuration gap prevents scaling.
    inconclusive: Test validity, environment, licensing, or evidence quality prevents a reliable comparison.

assumptions:
  - Numeric acceptance thresholds will be set by Point32Health from operational requirements and the baseline, then frozen before Agent 365 results are reviewed.
  - Dramatic phrasing and visual metaphors are training embellishments, not additional customer claims.

gaps:
  - Named accountable Point32Health decision maker.
  - Proof milestones and final decision date.
  - Customer-approved numeric thresholds, safety gates, and economic hurdle.

confidentiality: customer-safe

artifact_outline:
  - "Hero: 800 experiments reveal one leadership decision"
  - "Problem: creation is moving faster than a coherent control picture"
  - "Stakes: momentum without oversight creates drag, not scale"
  - "Guide: evidence before investment"
  - "Plan: frame it, prove it, choose it"
  - "Proof: one scorecard and four legitimate decision outcomes"
  - "Success: employees move faster inside visible boundaries"
  - "Action: name the owner, set the date, approve the proof"

# the evidence_map will not be used in this project
# evidence_map:
  

renderer_handoff:
  artifact_type: reveal.js transformation deck with synchronized markdown talk track
  purpose: align and decide
  visual_motif: A field of many agent signals converging into one governed path.
  format_constraints:
    - Five speakers with a maximum of two minutes each.
    - Customer remains the hero; Microsoft remains the guide.
    - Every slide advances one narrative beat and uses a visual, diagram, or data signal.
    - Approximate and hypothetical language remains visibly qualified.
  confidentiality: customer-safe
