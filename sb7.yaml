mode: customer-facing
audience:
  - Point32Health executive leadership
  - agent governance and security leaders
  - technology decision makers

hero:
  entity: Point32Health
  desired_outcome: >
    Enable employees to benefit from AI agents while maintaining
    governance, security, and operational control.

problem:
  external: >
    Agent creation and distribution may be outpacing centralized
    inventory, ownership, access, sharing, data, and connector controls.
  internal: >
    Leadership does not yet have sufficient evidence to determine whether
    existing controls are adequate or Agent 365 provides material value.
  stakes: >
    Controls that lag adoption can increase manual work and make agent
    innovation harder to trust and scale.

guide:
  empathy: >
    Microsoft recognizes that Point32Health requires concrete evidence
    before making a significant investment.
  competence_evidence:
    - Existing and proposed controls can be evaluated together.
    - Representative scenarios can make improvements and remaining gaps visible.
    - The evaluation explicitly documents licensing and configuration boundaries.

plan:
  - Establish the decision contract, including the accountable owner, decision date, representative scenarios, and scorecard.
  - Baseline current controls and test Agent 365 against the same agents, scenarios, and evidence requirements.
  - Compare results and decide whether to scale, retain existing controls, remediate and retest, or declare the evidence inconclusive.

action:
  next_step: Approve the decision contract and structured Agent 365 proof of concept.
  owner: To be named by Point32Health before proof approval.
  due_date: null
  readiness_conditions:
    - Name one accountable Point32Health decision maker and the required advisers.
    - Set the proof milestones and final decision date.
    - Approve representative scenarios, measurement methods, and decision rules.

failure_avoided: >
  Avoid unmanaged agent growth and decisions based on assumptions,
  including unnecessary purchasing or rejecting useful controls prematurely.

success:
  future_state: >
    Employees can use approved agents within clear boundaries, governance teams
    can understand ownership, access, and connections with less manual review,
    and security teams can investigate with more actionable evidence. Point32Health
    can scale proven agent use with an evidence-backed understanding of residual risk.
  metrics:
    - Coverage of agent ownership, access, data, and connector visibility.
    - Pass rate for agreed access and sharing policy scenarios.
    - Investigation time and required evidence available for agreed scenarios.
    - Manual steps or analyst effort remaining after the proof.
    - Severity of unresolved risks and the authority required to accept them.
    - Licensing and operating cost against an agreed economic hurdle.
  decision_rule:
    scale: Safety gates, improvement thresholds, residual-risk acceptance, and the economic hurdle are met.
    retain: Existing controls meet the agreed need and Agent 365 does not clear the incremental-value threshold.
    remediate_and_retest: Material value is visible, but a defined control or configuration gap prevents scaling.
    inconclusive: Test validity, environment, licensing, or evidence quality prevents a reliable comparison.

assumptions:
  - Numeric acceptance thresholds will be set by Point32Health from operational requirements and the baseline, then frozen before Agent 365 results are reviewed.

gaps:
  - Named accountable Point32Health decision maker.
  - Proof milestones and final decision date.
  - Customer-approved numeric thresholds, safety gates, and economic hurdle.

confidentiality: customer-safe
